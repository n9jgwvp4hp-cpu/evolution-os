# DigitalOcean App Platform spec for Evolution OS — FASTEST live path.
# ------------------------------------------------------------------
# One web service (with its in-process mission worker) + Managed Postgres.
# The web service's health check keeps the worker alive, so missions run even
# with no app open. instance_count MUST stay 1 (single worker).
#
# (The dedicated web+worker split for higher scale is documented in
#  ARCHITECTURE.md — a later upgrade, not needed to go live.)
#
# Deploy: doctl apps create --spec .do/app.yaml
# Set OPENAI_API_KEY (and optional Google keys) as encrypted secrets.
# ------------------------------------------------------------------
name: evolution-os
region: nyc

services:
  - name: web
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 3000
    # Public repo → git source needs no DigitalOcean↔GitHub connection.
    # (Switch to a `github:` block later if you want auto-deploy on push.)
    git:
      repo_clone_url: https://github.com/n9jgwvp4hp-cpu/evolution-os.git
      branch: feature/personal-ai-assistant
    build_command: npm run build
    run_command: npm start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 25
      period_seconds: 15
    # ⚠️  SECRETS ARE NOT IN THIS FILE. The app reads them from the platform env
    #     (process.env.OPENAI_API_KEY etc.). Set/rotate them with:
    #         bash set-openai-key.sh        (OpenAI key, hidden prompt)
    #     or the DigitalOcean dashboard → web → Environment Variables.
    #
    # ⚠️  DO NOT run `doctl apps update --spec .do/app.yaml` against the LIVE app:
    #     applying this file would DROP the secrets set on the platform and break
    #     production. This spec is a reference for the INITIAL `apps create` only;
    #     add OPENAI_API_KEY (and any Google keys) as encrypted secrets right
    #     after creating the app.
    envs:
      - { key: NODE_ENV, value: production }
      - { key: OPENAI_MODEL, value: gpt-4o-mini }
      - { key: DATABASE_URL, scope: RUN_AND_BUILD_TIME, type: SECRET, value: "${evolution-db.DATABASE_URL}" }
      # OPENAI_API_KEY  → set on the platform (see warning above), never committed.
      # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI → same, optional.

databases:
  - name: evolution-db
    engine: PG
    version: "16"
    production: false # smallest managed DB to start; resize anytime
