# DigitalOcean App Platform spec for Evolution OS — two-component (decoupled).
# ------------------------------------------------------------------
#   • web    — stateless Next.js (UI + API). DISABLE_WORKER=true: it does NOT
#              execute missions.
#   • worker — dedicated always-on process (`npm run worker` → worker.ts) that
#              executes missions 24/7, independent of the web tier. A web
#              deploy/restart never interrupts mission execution.
# Both share one Managed PostgreSQL brain, so missions persist and survive
# redeploys (a queued/running mission is resumed by the worker on boot).
#
# SECRETS (OPENAI_API_KEY, DATABASE_URL, GOOGLE_CLIENT_ID/SECRET, GOOGLE_REDIRECT_URI)
# are set on the platform (encrypted), NOT in this file. App-level secrets are
# inherited by every component; DATABASE_URL + OPENAI_API_KEY are also set on
# the worker so it always reaches Postgres. Do NOT `doctl apps update --spec`
# this file against the live app — it would drop those secrets.
#
# Keep BOTH components at instance_count: 1 (single worker = no double-execution;
# multi-worker would require the DB claim queue — see ARCHITECTURE.md Phase 3).
# ------------------------------------------------------------------
name: evolution-os
region: nyc

services:
  - name: web
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 3000
    git:
      repo_clone_url: https://github.com/n9jgwvp4hp-cpu/evolution-os.git
      branch: feature/personal-ai-assistant
    build_command: npm run build
    run_command: npm start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 25
      period_seconds: 15
    envs:
      - { key: NODE_ENV, value: production }
      - { key: DISABLE_WORKER, value: "true" } # web must NOT run the in-process worker
      - { key: OPENAI_MODEL, value: gpt-4o-mini }
      # OPENAI_API_KEY, DATABASE_URL, GOOGLE_* → platform secrets (encrypted).

workers:
  - name: worker
    instance_count: 1 # singleton; scale-out needs the DB claim queue
    instance_size_slug: apps-s-1vcpu-1gb
    git:
      repo_clone_url: https://github.com/n9jgwvp4hp-cpu/evolution-os.git
      branch: feature/personal-ai-assistant
    build_command: echo "worker: deps only, no Next build"
    run_command: npm run worker
    envs:
      - { key: NODE_ENV, value: production }
      - { key: OPENAI_MODEL, value: gpt-4o-mini }
      # OPENAI_API_KEY + DATABASE_URL set as platform secrets on this component
      # so the worker always reaches Postgres; GOOGLE_* inherited app-level.

# Managed PostgreSQL is a standalone cluster (not inline); its connection
# string is the DATABASE_URL secret above.
