# DigitalOcean App Platform spec for Evolution OS
# ------------------------------------------------------------------
# Use this with: doctl apps create --spec .do/app.yaml
# (or paste it in the App Platform UI → "Edit your app spec").
#
# Before applying, replace the two placeholders:
#   <YOUR_GITHUB_REPO>   e.g. n9jgwvp4hp-cpu/evolution-os
#   <YOUR_APP_DOMAIN>    your app's URL once created, e.g.
#                        evolution-os-xxxxx.ondigitalocean.app
#
# IMPORTANT: keep the web service at instance_count: 1 so exactly one mission
# worker runs (the worker executes in-process). To scale the web tier, split
# the worker into its own component and set DISABLE_WORKER=true on the web one.
# ------------------------------------------------------------------
name: evolution-os
region: nyc

services:
  - name: web
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 3000

    github:
      repo: <YOUR_GITHUB_REPO>
      branch: main
      deploy_on_push: true

    build_command: npm run build
    run_command: npm start

    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 15

    envs:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD
      - key: OPENAI_MODEL
        scope: RUN_AND_BUILD_TIME
        value: gpt-4o-mini
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        # Bound automatically from the managed database below.
        value: ${evolution-db.DATABASE_URL}
      - key: GOOGLE_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: REPLACE_IN_DASHBOARD
      - key: GOOGLE_REDIRECT_URI
        scope: RUN_AND_BUILD_TIME
        value: https://<YOUR_APP_DOMAIN>/api/google/callback

databases:
  - name: evolution-db
    engine: PG
    version: "16"
    # Smallest managed dev DB; resize anytime. Set production: true for a
    # standalone production cluster.
    production: false
