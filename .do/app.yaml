# DigitalOcean App Platform spec for Evolution OS
# ------------------------------------------------------------------
# Two-component, always-on architecture:
#   • web    — stateless Next.js (UI + API). Its in-process worker is DISABLED.
#   • worker — dedicated always-on process that executes missions 24/7,
#              independent of web traffic and of every user device.
# Both share one Managed PostgreSQL brain.
#
# Apply with: doctl apps create --spec .do/app.yaml
# Replace <YOUR_GITHUB_REPO> and (after first deploy) <YOUR_APP_DOMAIN>.
# Set the SECRET values in the dashboard.
# ------------------------------------------------------------------
name: evolution-os
region: nyc

services:
  - name: web
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    http_port: 3000
    github:
      repo: <YOUR_GITHUB_REPO>
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm start
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 15
    envs:
      - { key: NODE_ENV, value: production }
      - { key: DISABLE_WORKER, value: "true" } # web does NOT execute missions
      - { key: OPENAI_API_KEY, scope: RUN_AND_BUILD_TIME, type: SECRET, value: REPLACE_IN_DASHBOARD }
      - { key: OPENAI_MODEL, value: gpt-4o-mini }
      - { key: DATABASE_URL, scope: RUN_AND_BUILD_TIME, type: SECRET, value: "${evolution-db.DATABASE_URL}" }
      - { key: GOOGLE_CLIENT_ID, scope: RUN_AND_BUILD_TIME, type: SECRET, value: REPLACE_IN_DASHBOARD }
      - { key: GOOGLE_CLIENT_SECRET, scope: RUN_AND_BUILD_TIME, type: SECRET, value: REPLACE_IN_DASHBOARD }
      - { key: GOOGLE_REDIRECT_URI, value: "https://<YOUR_APP_DOMAIN>/api/google/callback" }

workers:
  - name: worker
    instance_count: 1 # singleton today; scale out via DB claim queue (see ARCHITECTURE.md Phase 3)
    instance_size_slug: apps-s-1vcpu-1gb
    github:
      repo: <YOUR_GITHUB_REPO>
      branch: main
      deploy_on_push: true
    # No Next build needed for the worker — just install deps and run it.
    build_command: "true"
    run_command: npm run worker
    envs:
      - { key: NODE_ENV, value: production }
      - { key: OPENAI_API_KEY, scope: RUN_TIME, type: SECRET, value: REPLACE_IN_DASHBOARD }
      - { key: OPENAI_MODEL, value: gpt-4o-mini }
      - { key: DATABASE_URL, scope: RUN_TIME, type: SECRET, value: "${evolution-db.DATABASE_URL}" }
      # Google creds let background missions send mail / create events too.
      - { key: GOOGLE_CLIENT_ID, scope: RUN_TIME, type: SECRET, value: REPLACE_IN_DASHBOARD }
      - { key: GOOGLE_CLIENT_SECRET, scope: RUN_TIME, type: SECRET, value: REPLACE_IN_DASHBOARD }
      # Optional: better research depth if you add a search key.
      # - { key: BRAVE_SEARCH_API_KEY, scope: RUN_TIME, type: SECRET, value: REPLACE_IN_DASHBOARD }

databases:
  - name: evolution-db
    engine: PG
    version: "16"
    production: true # HA-capable; enable a standby node for automatic failover
